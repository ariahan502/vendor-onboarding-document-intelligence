name: Regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    name: MVP regression evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Run deterministic regression suite
        run: PYTHONPATH=backend python backend/scripts/evaluate_mvp.py

      - name: Verify Alembic migration from an empty database
        working-directory: backend
        run: |
          DATABASE_URL="sqlite+pysqlite:////tmp/vendor-onboarding-ci.db" alembic upgrade head
          DATABASE_URL="sqlite+pysqlite:////tmp/vendor-onboarding-ci.db" PYTHONPATH=. python -c "from app.db.session import engine; from sqlalchemy import inspect; assert 'policy_rule_revisions' in inspect(engine).get_table_names()"
